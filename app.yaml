apiVersion: apps/v1
kind: Deployment

metadata:
  name: myapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
        - name: myapp

          image: parimal1984/eommerceproject:4

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service

metadata:
  name: myapp-service

spec:
  type: LoadBalancer

  selector:
    app: myapp

  ports:
    - port: 80
      targetPort: 8080
